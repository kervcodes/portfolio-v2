<svg width="64" height="64" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <!-- Stencilled equipment plate: the same mark AnimatedLogo.jsx draws.
       No gradient, no system display face — the letters are drawn as paths. -->
  <rect width="100" height="100" fill="#2b3038" />
  <rect x="14" y="14" width="72" height="72" fill="none" stroke="#eceef0" stroke-width="4" />
  <!-- corner rivets -->
  <rect x="20" y="20" width="5" height="5" fill="#eceef0" opacity="0.65" />
  <rect x="75" y="20" width="5" height="5" fill="#eceef0" opacity="0.65" />
  <rect x="20" y="75" width="5" height="5" fill="#eceef0" opacity="0.65" />
  <rect x="75" y="75" width="5" height="5" fill="#eceef0" opacity="0.65" />
  <g fill="#eceef0">
    <!-- K -->
    <rect x="29" y="36" width="6" height="28" />
    <polygon points="35,50 45,36 52,36 42,50 52,64 45,64" />
    <!-- N -->
    <rect x="58" y="36" width="6" height="28" />
    <rect x="71" y="36" width="6" height="28" />
    <polygon points="64,36 64,47 71,58 71,64" />
  </g>
</svg>
