<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kervintz Noel | Software Engineer</title>
    <meta
      name="description"
      content="Kervintz Noel — Software Engineer in Boston. Twelve years from enterprise IT to site reliability engineering, now building AI-powered workflows for real business operations. Open to full-time roles."
    />
    <!-- Script face for the loader only (League Script), subset to the
         eight letters it writes, so it is a few KB. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=League+Script&text=Kervintz&display=block"
      rel="stylesheet"
    />
    <style>

      .sig-sheet {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: grid;
        place-items: center;
        background: #e9e3d8;
        pointer-events: none;
      }
      .sig-mark {
        width: min(86vw, 640px);
        height: auto;
        overflow: visible;
      }
      .sig-text {
        font-family: "League Script", cursive;
        font-size: 200px;
        fill: #1c2027;
        stroke: #1c2027;
        stroke-width: 3.5px;
        stroke-linejoin: round;
        paint-order: stroke;
        opacity: 0;
      }
      .is-writing .sig-text { opacity: 1; }
      .sig-pen {
        fill: none;
        stroke: #fff;
        stroke-linecap: round;
        stroke-linejoin: round;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
      }
      @keyframes sig-ink {
        to { stroke-dashoffset: 0; }
      }
      @keyframes sig-out {
        to { opacity: 0; visibility: hidden; }
      }
      @keyframes sig-fade {
        to { opacity: 0; visibility: hidden; }
      }
      #boot-loader { animation: sig-out 500ms ease 6000ms forwards; }
      .sig-sheet--route { animation: sig-out 400ms ease 4000ms forwards; }
      #boot-loader.is-done,
      .sig-sheet--route.is-done { animation: sig-fade 600ms ease-out forwards; }
      :root { --boot-delay: 2600ms; }
      @media (prefers-reduced-motion: reduce) {
        #boot-loader { display: none; }
        :root { --boot-delay: 0ms; }
      }
    </style>
    <noscript><style>.sig-text { opacity: 1; }</style></noscript>
  </head>
  <body>
    <div id="boot-loader" class="sig-sheet" aria-hidden="true">
      <svg class="sig-mark" viewBox="0 0 640 260" role="presentation">
        <mask id="sig-mask-boot" maskUnits="userSpaceOnUse" x="-100" y="-150" width="840" height="560">
          <path class="sig-pen" pathLength="1" />
        </mask>
        <text class="sig-text" x="320" y="170" text-anchor="middle">Kervintz</text>
      </svg>
    </div>
    <script>
      (function () {
        window.__sigWrite = function (sheet, ms) {
          var text = sheet.querySelector(".sig-text");
          var pen = sheet.querySelector(".sig-pen");
          var mask = sheet.querySelector("mask");
          var write = function () {
            var b = text.getBBox();
            var w = b.height * 0.26;
            var top = b.y + w * 0.5;
            var bottom = b.y + b.height - w * 0.5;
            var step = w * 0.55;
            var d = "M" + (b.x - w * 0.5).toFixed(1) + "," + top.toFixed(1);
            var down = true;
            for (var x = b.x; x <= b.x + b.width + w; x += step) {
              d += " L" + x.toFixed(1) + "," + (down ? bottom : top).toFixed(1);
              down = !down;
            }
            pen.setAttribute("d", d);
            pen.setAttribute("stroke-width", (w * 1.15).toFixed(1));
            text.setAttribute("mask", "url(#" + mask.id + ")");
            pen.style.animation =
              "sig-ink " + ms + "ms linear forwards"; // steady, like a hand
            sheet.classList.add("is-writing");
            return new Promise(function (done) {
              setTimeout(done, ms);
            });
          };
          var ready =
            document.fonts && document.fonts.load
              ? document.fonts.load('200px "League Script"', "Kervintz")
              : Promise.resolve();
          return ready.then(write, write);
        };

        var boot = document.getElementById("boot-loader");
        if (!boot || matchMedia("(prefers-reduced-motion: reduce)").matches) return;
        window.__sigWrite(boot, 2400).then(function () {
          boot.classList.add("is-done");
        });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
